# ============================================================================
# Mid-360 驱动配置
#
# 工作模式通过 ROS2 服务 ~/enable_sampling (SetBool) 和 ~/get_work_state
# (Trigger) 动态控制。启动时驱动自动将雷达切换到采样模式（硬编码）。
# ============================================================================

mid360_driver:
    ros__parameters:

        # ====================================================================
        # [net] 网络与设备发现
        # ====================================================================

        # 本机 IP（绑定 UDP 套接字，必须与雷达在同一子网）
        host_ip: "192.168.32.80"

        # 目标雷达 IP。
        #   "auto"  → 广播发现 (0x0000)
        #   具体 IP  → 直连（跳过发现）
        lidar_ip: "auto"


        # ====================================================================
        # [pcl] 点云设置
        # ====================================================================

        # 点云数据格式 [0x0000]
        #   1 = 直角坐标32bit  (int32 xyz mm, 每点14字节, 精度1mm)
        #   2 = 直角坐标16bit  (int16 xyz 10mm, 每点8字节, 精度1cm)
        #   3 = 球坐标         (深度+theta+phi, 每点10字节)
        pcl_data_type: 1

        # 点云话题与 frame_id
        lidar_topic: "/lidar/mid360/lidar"
        lidar_frame: "mid360_frame"

        # 发布限流频率（Hz）。
        #   0  → 不限流，有数据即发
        #   10 → 每秒最多 10 条消息（与雷达硬件 10Hz 对齐）
        #   50 → 1/5 帧一条消息
        # 雷达始终以 ~200,000 pts/s 连续输出，此参数仅控制 ROS 切分粒度。
        publish_freq_hz: 10


        # ====================================================================
        # [imu] IMU 设置
        # ====================================================================

        # IMU 数据推送开关 [0x001C]
        imu_data_en: true

        # IMU 话题与 frame_id
        imu_topic: "/lidar/mid360/imu"
        imu_frame: "mid360_imu_frame"


        # ====================================================================
        # [detect] 探测模式 [0x0018]
        # ====================================================================
        #   0 = 正常模式
        #   1 = 敏感模式（增强低反射率探测，可能略增噪点）
        # ====================================================================

        detect_mode: 0


        # ====================================================================
        # [filter] 点云过滤（发布时软件层过滤）
        # ====================================================================
        # 发布前对每个点做空间裁剪，超出范围的点被静默丢弃。
        # 距离过滤使用距离平方比较来避免 sqrt() 调用。
        # ====================================================================

        # 最小/最大距离（米）。-1 = 不启用。
        min_point_distance: -1.0
        max_point_distance: -1.0

        # X 轴过滤（前后方向）
        enable_x_filter: false
        min_x: -2.0
        max_x: 2.0

        # Y 轴过滤（左右方向）
        enable_y_filter: false
        min_y: -2.0
        max_y: 2.0

        # Z 轴过滤（上下方向）
        enable_z_filter: false
        min_z: -2.0
        max_z: 2.0


        # ====================================================================
        # [advanced] 高级
        # ====================================================================

        # 是否发布 TF：livox_frame -> imu_frame（使用硬编码 IMU 外参）
        publish_tf: true


        # ====================================================================
        # [debug] 调试日志
        # ====================================================================
        # 启用后, 驱动会向指定路径写入详细 JSON lines 日志 (.trc 文件),
        # 格式兼容 MissionLogger 风格, 方便 agent 读取和自动分析。
        #
        # 日志写入位置:
        #   {log_base_path}/{启动时间戳 YYYYMMDD_HHMMSS}/mid360_driver.trc
        #
        # 若 log_base_path 目录不存在, 驱动会在终端输出 RCLCPP_WARN 告警
        # 并自动创建目录后继续写入日志。
        # ====================================================================

        # 是否启用详细 debug 日志
        debug_log_enable: true

        # debug 日志基路径 (最终路径 = 此路径 + 时间戳子目录 + mid360_driver.trc)
        log_base_path: "/home/inkc/inkc-ws/v2027/src/driver/mid360_driver/log/"
